---
- name: "Cli_parse_native CLI flow: cli_parse_native"
  hosts: cli_parse_native_cli_parse_native
  gather_facts: false
  tasks:
    - name: Parse show interface output with the native parser
      ansible.utils.cli_parse:
        command: show interface
        parser:
          name: ansible.netcommon.native
          template_path: "{{ playbook_dir }}/templates/nxos_show_interface.yaml"
        set_fact: nxos_native_parsed
      register: nxos_native_command

    - name: Parse the same output with the native interface template
      ansible.utils.cli_parse:
        text: "{{ nxos_native_command['stdout'] }}"
        parser:
          name: ansible.netcommon.native
          template_path: "{{ playbook_dir }}/templates/nxos_show_interface.yaml"
      register: nxos_native_text

    - name: Verify native parser output
      ansible.builtin.assert:
        that:
          - nxos_native_parsed is defined
          - nxos_native_command['parsed']['mgmt0'] is defined
          - nxos_native_command.stdout is defined
          - nxos_native_command.stdout_lines is defined
          - nxos_native_text['parsed']['mgmt0'] is defined
