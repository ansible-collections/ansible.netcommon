---
dependency:
  name: galaxy
  options:
    requirements-file: extensions/molecule/net_ping/requirements.yml

driver:
  name: default
platforms:
  - name: cisshgo-net_ping-net_ping
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ../cisshgo_fixtures/inventories/ansible/net_ping.yaml
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_HOST_KEY_CHECKING: "false"
    ANSIBLE_DEPRECATION_WARNINGS: "false"
  playbooks:
    create: ../_shared/create.yml
    converge: converge.yml
    verify: ../_shared/verify.yml
    destroy: ../_shared/destroy.yml
scenario:
  test_sequence:
    - dependency
    - create
    - converge
    - verify
    - destroy
prerun: false
verifier:
  name: ansible
