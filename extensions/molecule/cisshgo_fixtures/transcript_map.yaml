      - command: show running-config | section ^interface
        transcript: transcripts/network_resource/network_resource/after_interface_description_show_running_config.txt
      - command: show running-config all | incl 'system default switchport'
        transcript: transcripts/network_resource/network_resource/after_interface_description_show_running_config_again.txt
      - command: configure terminal
        transcript: transcripts/network_resource/network_resource/configure_terminal.txt
      - command: interface Ethernet1/1
        transcript: transcripts/common/generic_empty_return.txt
      - command: description CONNECTION_TO_EXTERNAL_WORLD
        transcript: transcripts/common/generic_empty_return.txt
      - command: end
        transcript: transcripts/common/generic_empty_return.txt
      - command: show running-config | section ^interface
        transcript: transcripts/network_resource/network_resource/after_interface_description_again_show_running_config.txt
      - command: show running-config | section ^interface
        transcript: transcripts/network_resource/network_resource/after_interface_description_again_show_running_config.txt
      - command: show running-config all | incl 'system default switchport'
        transcript: transcripts/network_resource/network_resource/after_interface_description_again_show_running_config_again.txt
