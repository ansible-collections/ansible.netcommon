scenarios:
  cli-command-cli-command:
    platform: cli_command_nxos
    sequence: []
  cli-config-cli-config:
    platform: cli_config_nxos
    sequence:
      - command: show running-config
        transcript: transcripts/cli_config/cli_config/before_show_running_config.txt
      - command: configure terminal
        transcript: transcripts/cli_config/cli_config/configure_terminal.txt
      - command: hostname foo
        transcript: transcripts/common/generic_empty_return.txt
      - command: feature nxapi
        transcript: transcripts/common/generic_empty_return.txt
      - command: end
        transcript: transcripts/common/generic_empty_return.txt
      - command: show running-config
        transcript: transcripts/cli_config/cli_config/after_hostname_feature_show_running_config.txt
      - command: configure terminal
        transcript: transcripts/cli_config/cli_config/configure_terminal.txt
      - command: interface Loopback998
        transcript: transcripts/common/generic_empty_return.txt
      - command: description generic_host is the best
        transcript: transcripts/common/generic_empty_return.txt
      - command: shutdown
        transcript: transcripts/common/generic_empty_return.txt
      - command: end
        transcript: transcripts/common/generic_empty_return.txt
      - command: show running-config
        transcript: transcripts/cli_config/cli_config/after_interface_description_shutdown_show_running_config.txt
      - command: configure terminal
        transcript: transcripts/cli_config/cli_config/configure_terminal.txt
      - command: no interface Loopback998
        transcript: transcripts/common/generic_empty_return.txt
      - command: end
        transcript: transcripts/common/generic_empty_return.txt
  cli-backup-cli-backup:
    platform: cli_backup_nxos
    sequence:
      - command: show running-config
        transcript: transcripts/cli_backup/cli_backup/before_show_running_config.txt
  cli-restore-cli-restore:
    platform: cli_restore_nxos
    sequence:
      - command:
          configure replace bootflash:netcommon_molecule_baseline_a61556b0.cfg
          best-effort
        transcript: transcripts/cli_restore/cli_restore/after_restore.txt
  net-ping-net-ping:
    platform: net_ping_nxos
    sequence:
      - command: ping 192.168.255.77 count 1
        transcript: transcripts/net_ping/net_ping/ping_result.txt
  network-resource-network-resource:
    platform: network_resource_nxos
    sequence:
      - command: show running-config | section ^interface
        transcript: transcripts/network_resource/network_resource/before_show_running_config.txt
      - command: show running-config all | incl 'system default switchport'
        transcript: transcripts/network_resource/network_resource/before_show_running_config_again.txt
      - command: configure terminal
        transcript: transcripts/network_resource/network_resource/configure_terminal.txt
      - command: interface Ethernet1/1
        transcript: transcripts/common/generic_empty_return.txt
      - command: description Configured by Ansible
